name: yact test

on:
  pull_request:
    branches: [main] 

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet code
        run: go vet ./...

      - name: Run tests
        run: go test ./...