name: yact

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command'
        required: true
        type: choice
        options:
          - 'plan'
          - 'act'
          - 'ask'
        default: 'plan'
      model:
        description: "model"
        type: choice
        options:
          - 'haiku'
          - 'sonnet'
          - 'opus'
          - 'fable'
          - 'qmax'
          - 'qcoder'
        default: 'sonnet'
      prompt:
        description: "prompt"
        type: string
        required: false
      buffer:
        description: "use prompt from buffer"
        type: boolean
        default: false
      existing_prompt:
        description: "use existing prompt"
        type: boolean
        default: false
      no_write:
        description: "do not write files, print response instead"
        type: boolean
        default: false
      clear:
        description: "clear yact folder"
        type: boolean
        default: false
      commit_message:
        description: "commit message"
        type: string
        required: true
      readme_md:
        description: "README.md"
        type: boolean
        default: false
      tag_base:
        description: "tag: base"
        type: boolean
        default: false
      tag_api:
        description: "tag: api"
        type: boolean
        default: false
      tag_config:
        description: "tag: config"
        type: boolean
        default: false
      tag_cli:
        description: "tag: cli"
        type: boolean
        default: false
      tag_prompt:
        description: "tag: prompt"
        type: boolean
        default: false
      tag_read:
        description: "tag: read"
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download YACT
        run: |
          curl -L -o y "https://github.com/agabor/yact/releases/latest/download/yact-linux-amd64"
          chmod +x y

      - name: configure Claude API key
        run: ./y config anthropic_api_key "${{ secrets.CLAUDE_API_KEY }}"

      - name: read README.md
        if: ${{ github.event.inputs.readme_md == 'true' }}
        run: ./y read ./README.md

      - name: read tag base
        if: ${{ github.event.inputs.tag_base == 'true' }}
        run: ./y read base

      - name: read tag api
        if: ${{ github.event.inputs.tag_api == 'true' }}
        run: ./y read api

      - name: read tag config
        if: ${{ github.event.inputs.tag_config == 'true' }}
        run: ./y read config

      - name: read tag cli
        if: ${{ github.event.inputs.tag_cli == 'true' }}
        run: ./y read cli

      - name: read tag prompt
        if: ${{ github.event.inputs.tag_prompt == 'true' }}
        run: ./y read prompt

      - name: read tag read
        if: ${{ github.event.inputs.tag_read == 'true' }}
        run: ./y read read

      - name: run command
        env:
          YACT_COMMAND: ${{ github.event.inputs.command }}
          YACT_MODEL: ${{ github.event.inputs.model }}
          YACT_PROMPT: ${{ github.event.inputs.prompt }}
          YACT_BUFFER: ${{ github.event.inputs.buffer }}
          YACT_EXISTING_PROMPT: ${{ github.event.inputs.existing_prompt }}
          YACT_NO_WRITE: ${{ github.event.inputs.no_write }}
        run: |
          args=("$YACT_COMMAND" "-d" "-q" "--$YACT_MODEL")

          if [ "$YACT_NO_WRITE" = "true" ]; then
            args+=("-n")
          fi

          if [ "$YACT_BUFFER" = "true" ]; then
            args+=("-b")
          elif [ "$YACT_EXISTING_PROMPT" != "true" ]; then
            args+=("$YACT_PROMPT")
          fi

          ./y "${args[@]}"

      - name: Clean up
        if: ${{ github.event.inputs.clear == 'true' }}
        run: rm -rf .yact

      - name: commit and push changes
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "plan: ${{ github.event.inputs.commit_message }}"
          git push