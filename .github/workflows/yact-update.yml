name: yact update pull request

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  implement:
    if: github.event.label.name == 'update'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Choose model
        env:
          DEFAULT_MODEL: haiku
        run: |
          # The strongest model label on the pull request wins. Without one, the default is used.
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          model="$DEFAULT_MODEL"
          for candidate in haiku sonnet opus; do
            if grep -qxF "$candidate" <<< "$labels"; then
              model="$candidate"
            fi
          done
          echo "MODEL=$model" >> "$GITHUB_ENV"
          echo "Using model: $model"

      - uses: actions/checkout@v7
      
      - name: Checkout branch
        run: gh pr checkout $PR_NUMBER

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install yact
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/y" https://github.com/agabor/yact/releases/latest/download/yact-linux-amd64
          chmod +x "$HOME/bin/y"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          $HOME/bin/y config anthropic_api_key ${{ secrets.ANTHROPIC_API_KEY }} 

      - name: Configure git identity
        run: |
          # The noreply address is tied to the numeric user id, which the token's actor cannot supply, so it is looked up from the public user API.
          user_id=$(gh api "users/$TRIGGERING_ACTOR" --jq '.id')
          git config user.name "$TRIGGERING_ACTOR"
          git config user.email "$user_id+$TRIGGERING_ACTOR@users.noreply.github.com"

      - name: Fetch plan and comment
        run: |
          gh pr view $PR_NUMBER --json body --jq '.body' > yact-prompt.md
          echo >> yact-prompt.md
          gh pr view $PR_NUMBER --json comments --jq '.comments[-1].body' >> yact-prompt.md
          cat yact-prompt.md

      - name: Create plan
        run: |
          y -m "$MODEL" --no-progress plan

      - name: Refine plan with missing context
        run: |
          if grep -qxF '## Missing context' yact-prompt.md; then
            y -m "$MODEL" --no-progress plan
          fi

      - name: Check plan has no missing context
        run: |
          if grep -qxF '## Missing context' yact-prompt.md; then
            echo "Plan still has missing context" >&2
            cat yact-prompt.md 
            exit 1
          fi

      - name: Implement plan
        id: implement
        run: y -m "$MODEL" --no-progress act

      - name: Upload buffer
        if: always() && steps.implement.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: yact-buffer-pr-${{ github.event.pull_request.number }}
          path: .yact/temp/buffer.txt
          if-no-files-found: ignore

      - name: Format code
        run: go fmt ./...

      - name: Commit changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git diff --cached > "$RUNNER_TEMP/changes.diff"
            y output < "$RUNNER_TEMP/changes.diff"
            y -m "$MODEL" --no-progress -i none query "The output contains a git diff that updates pull request #$PR_NUMBER after review feedback. Write the git commit message for it. The first line is an imperative summary of at most 72 characters that describes what changed. Then a blank line and a short body that explains why the change was made. Reply with the message only, without markdown fences." > "$RUNNER_TEMP/commit-message.txt"
            # A failed or empty model reply must not block the push.
            if [ ! -s "$RUNNER_TEMP/commit-message.txt" ]; then
              echo "Update pull request #$PR_NUMBER after review feedback" > "$RUNNER_TEMP/commit-message.txt"
            fi
            git commit -F "$RUNNER_TEMP/commit-message.txt"
          fi
          git push

      - name: Remove trigger label
        if: always()
        run: gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/update" --silent || echo "Could not remove the update label" >&2
