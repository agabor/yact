name: yact issue

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to implement
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ inputs.issue }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install yact
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/y" https://github.com/agabor/yact/releases/latest/download/yact-linux-amd64
          chmod +x "$HOME/bin/y"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          $HOME/bin/y config anthropic_api_key ${{ secrets.ANTHROPIC_API_KEY }} 

      - name: Configure git identity
        run: |
          # The noreply address is tied to the numeric user id, which the token's actor cannot supply, so it is looked up from the public user API.
          user_id=$(gh api "users/$TRIGGERING_ACTOR" --jq '.id')
          git config user.name "$TRIGGERING_ACTOR"
          git config user.email "$user_id+$TRIGGERING_ACTOR@users.noreply.github.com"

      - name: Create task context
        run: y new

      - name: Fetch issue
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n\n" + (.body // "")' > yact-prompt.md
          cat yact-prompt.md

      - name: Create plan
        run: |
          y --no-progress -p plan
          cat yact-prompt.md

      - name: Refine plan with missing context
        run: |
          if grep -qxF '## Missing context' yact-prompt.md; then
            y --no-progress -p plan
            cat yact-prompt.md
          fi

      - name: Check plan has no missing context
        run: |
          if grep -qxF '## Missing context' yact-prompt.md; then
            echo "Plan still has missing context" >&2
            cat yact-prompt.md 
            exit 1
          fi

      - name: Create branch
        run: git checkout -b "yact/issue-$ISSUE_NUMBER"

      - name: Implement plan
        id: implement
        run: y --no-progress act

      - name: Upload buffer
        if: always() && steps.implement.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: yact-buffer-issue-${{ inputs.issue }}
          path: .yact/temp/buffer.txt
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -am "Implement yact plan for issue #$ISSUE_NUMBER"
          fi
          git push -u origin "yact/issue-$ISSUE_NUMBER"

      - name: Run tests
        run: go test ./...

      - name: Open pull request
        run: |
          {
            cat yact-prompt.md
            echo
            echo "Closes #$ISSUE_NUMBER"
          } > yact-pr-body.md
          gh pr create \
            --head "yact/issue-$ISSUE_NUMBER" \
            --title "Implement issue #$ISSUE_NUMBER" \
            --body-file yact-pr-body.md
