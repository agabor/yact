name: yact issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  implement:
    if: contains(fromJSON('["implement-haiku","implement-sonnet","implement-opus"]'), github.event.label.name)
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CLAUDE_LEVEL: ${{ github.event.label.name == 'implement-haiku' && '1' || github.event.label.name == 'implement-sonnet' && '2' || '3' }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install yact
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/y" https://github.com/agabor/yact/releases/latest/download/yact-linux-amd64
          chmod +x "$HOME/bin/y"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          $HOME/bin/y config anthropic_api_key ${{ secrets.ANTHROPIC_API_KEY }} 

      - name: Configure git identity
        run: |
          # The noreply address is tied to the numeric user id, which the token's actor cannot supply, so it is looked up from the public user API.
          user_id=$(gh api "users/$TRIGGERING_ACTOR" --jq '.id')
          git config user.name "$TRIGGERING_ACTOR"
          git config user.email "$user_id+$TRIGGERING_ACTOR@users.noreply.github.com"

      - name: Create task context
        run: y new

      - name: Fetch issue
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n\n" + (.body // "")' > yact-prompt.md
          cat yact-prompt.md

      - name: Create plan
        run: |
          y -c "$CLAUDE_LEVEL" --no-progress -p plan
          cat yact-prompt.md

      - name: Refine plan with missing context
        run: |
          if grep -qxF '## Missing context' yact-prompt.md; then
            y -c "$CLAUDE_LEVEL" --no-progress -p plan
            cat yact-prompt.md
          fi

      - name: Check plan has no missing context
        run: |
          if grep -qxF '## Missing context' yact-prompt.md; then
            echo "Plan still has missing context" >&2
            cat yact-prompt.md 
            exit 1
          fi

      - name: Create branch
        run: git checkout -b "yact/issue-$ISSUE_NUMBER"

      - name: Implement plan
        id: implement
        run: y -c "$CLAUDE_LEVEL" --no-progress act

      - name: Upload buffer
        if: always() && steps.implement.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: yact-buffer-issue-${{ github.event.issue.number }}
          path: .yact/temp/buffer.txt
          if-no-files-found: ignore

      - name: Format code
        run: go fmt ./...

      - name: Commit changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git diff --cached > "$RUNNER_TEMP/changes.diff"
            y output < "$RUNNER_TEMP/changes.diff"
            y -c "$CLAUDE_LEVEL" --no-progress -i 0 -n query "The output contains a git diff that implements issue #$ISSUE_NUMBER. Write the git commit message for it. The first line is an imperative summary of at most 72 characters that describes the behavior added or changed, not the issue number. Then a blank line and a short body that explains why the change was made. Reply with the message only, without markdown fences." > "$RUNNER_TEMP/commit-message.txt"
            # A failed or empty model reply must not block the push.
            if [ ! -s "$RUNNER_TEMP/commit-message.txt" ]; then
              gh issue view "$ISSUE_NUMBER" --json title --jq '.title' > "$RUNNER_TEMP/commit-message.txt"
            fi
            git commit -F "$RUNNER_TEMP/commit-message.txt"
          fi
          git push -u origin "yact/issue-$ISSUE_NUMBER"

      - name: Open pull request
        run: |
          {
            cat yact-prompt.md
            echo
            echo "Closes #$ISSUE_NUMBER"
          } > yact-pr-body.md
          gh pr create \
            --head "yact/issue-$ISSUE_NUMBER" \
            --title "$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')" \
            --body-file yact-pr-body.md
