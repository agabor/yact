name: yact fix pull request

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  fix:
    if: github.event.label.name == 'fix'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Choose model
        env:
          DEFAULT_MODEL: haiku
        run: |
          # The strongest model label on the pull request wins. Without one, the default is used.
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          model="$DEFAULT_MODEL"
          for candidate in haiku sonnet opus; do
            if grep -qxF "$candidate" <<< "$labels"; then
              model="$candidate"
            fi
          done
          echo "MODEL=$model" >> "$GITHUB_ENV"
          echo "Using model: $model"

      - uses: actions/checkout@v7
      
      - name: Checkout branch
        run: gh pr checkout $PR_NUMBER

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install yact
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/y" https://github.com/agabor/yact/releases/latest/download/yact-linux-amd64
          chmod +x "$HOME/bin/y"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          $HOME/bin/y config anthropic_api_key ${{ secrets.ANTHROPIC_API_KEY }} 

      - name: Configure git identity
        run: |
          # The noreply address is tied to the numeric user id, which the token's actor cannot supply, so it is looked up from the public user API.
          user_id=$(gh api "users/$TRIGGERING_ACTOR" --jq '.id')
          git config user.name "$TRIGGERING_ACTOR"
          git config user.email "$user_id+$TRIGGERING_ACTOR@users.noreply.github.com"

      - name: Fetch Context
        run: |
          gh pr view $PR_NUMBER --json body --jq '.body' > yact-prompt.md
          y compact

      - name: Fix Build
        run: |
          if ! go build ./... > "$RUNNER_TEMP/build.txt" 2>&1; then
            cat "$RUNNER_TEMP/build.txt"
            y output < "$RUNNER_TEMP/build.txt"
            y -m "$MODEL" --no-progress act "fix build"
          fi

      - name: Fetch Context
        run: |
          gh pr view $PR_NUMBER --json body --jq '.body' > yact-prompt.md
          y compact

      - name: Fix Tests
        run: |
          if ! go test ./... > "$RUNNER_TEMP/test.txt" 2>&1; then
            cat "$RUNNER_TEMP/test.txt"
            y output < "$RUNNER_TEMP/test.txt"
            y -m "$MODEL" --no-progress act "fix tests"
          fi

      - name: Fetch Context
        run: |
          gh pr view $PR_NUMBER --json body --jq '.body' > yact-prompt.md
          y compact

      - name: Fix Vet
        run: |
          if ! go vet ./... > "$RUNNER_TEMP/vet.txt" 2>&1; then
            cat "$RUNNER_TEMP/vet.txt"
            y output < "$RUNNER_TEMP/vet.txt"
            y -m "$MODEL" --no-progress act "fix code issues"
          fi

      - name: Format code
        run: go fmt ./...

      - name: Commit changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git diff --cached > "$RUNNER_TEMP/changes.diff"
            y output < "$RUNNER_TEMP/changes.diff"
            y -m "$MODEL" --no-progress -i none query "The output contains a git diff that fixes build, test or vet failures of pull request #$PR_NUMBER. Write the git commit message for it. The first line is an imperative summary of at most 72 characters that names what was fixed. Then a blank line and a short body that explains why the change was needed. Reply with the message only, without markdown fences." > "$RUNNER_TEMP/commit-message.txt"
            # A failed or empty model reply must not block the push.
            if [ ! -s "$RUNNER_TEMP/commit-message.txt" ]; then
              echo "Fix build, test and vet failures for pull request #$PR_NUMBER" > "$RUNNER_TEMP/commit-message.txt"
            fi
            git commit -F "$RUNNER_TEMP/commit-message.txt"
          fi
          git push

      - name: Remove trigger label
        if: always()
        run: gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/fix" --silent || echo "Could not remove the fix label" >&2
